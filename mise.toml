# mise — developer tooling for Drone SITL (host and dev container)
# https://mise.jdx.dev/
#
# Scope: tools a developer runs *around* the build — pre-commit hooks and
# config/doc linters. mise is installed both on the host and in the dev
# container, but it never owns a runtime: the container's runtime (Ubuntu,
# ROS 2, Gazebo, system Python) is pinned by `Containerfile`, and the Rust
# toolchain by `rust-toolchain.toml`.
# Do NOT add rust/python here — in the container that would shadow the system
# Python ROS 2 needs and create a second source of version truth.

[tools]
pre-commit = "latest"   # git hooks run on the host before committing
shellcheck = "latest"   # lint shell in Makefile recipes / scripts
yamllint = "latest"     # lint compose.yaml and CI config

[tasks.setup]
description = "Install host dev tools and git hooks"
run = "pre-commit install"
